<div>
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold">ইনভেন্টরি ম্যানেজমেন্ট</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">আপনার স্টক এবং পণ্য পরিচালনা করুন।</p>
    </div>
    <button class="px-4 py-2 bg-green-500 text-white font-semibold rounded-md hover:bg-green-600 transition-colors flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
      নতুন পণ্য যোগ করুন
    </button>
  </div>

  <!-- Inventory Table -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
    <div class="p-4 flex justify-between items-center border-b dark:border-gray-700">
      <input type="text" placeholder="পণ্য খুঁজুন..." class="w-1/2 md:w-1/3 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-md p-2 text-sm focus:ring-green-500 focus:border-green-500">
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-50 dark:bg-gray-700/50 uppercase text-xs">
          <tr>
            <th scope="col" class="px-6 py-3">পণ্য</th>
            <th scope="col" class="px-6 py-3">SKU</th>
            <th scope="col" class="px-6 py-3">ক্যাটাগরি</th>
            <th scope="col" class="px-6 py-3 text-center">স্টক</th>
            <th scope="col" class="px-6 py-3 text-right">মূল্য</th>
            <th scope="col" class="px-6 py-3">স্ট্যাটাস</th>
            <th scope="col" class="px-6 py-3 text-right">কার্যক্রম</th>
          </tr>
        </thead>
        <tbody>
          @for(item of inventoryItems(); track item.id) {
            <tr class="border-b dark:border-gray-700">
              <td class="px-6 py-4 font-medium">{{item.productName}}</td>
              <td class="px-6 py-4 text-gray-500 dark:text-gray-400">{{item.sku}}</td>
              <td class="px-6 py-4">{{item.category}}</td>
              <td class="px-6 py-4 text-center font-medium">{{item.stock}}</td>
              <td class="px-6 py-4 text-right font-medium">৳{{item.price | number:'1.2-2'}}</td>
              <td class="px-6 py-4">
                <span class="px-2 py-1 font-semibold leading-tight text-xs rounded-full" [class]="getStockStatus(item.stock).className">
                  {{getStockStatus(item.stock).text}}
                </span>
              </td>
              <td class="px-6 py-4 text-right">
                <button class="text-indigo-600 hover:text-indigo-900 dark:text-indigo-400 dark:hover:text-indigo-300">সম্পাদনা</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
