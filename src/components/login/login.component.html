<div class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900">
  <div class="w-full max-w-md p-8 space-y-6 bg-white dark:bg-gray-800 rounded-lg shadow-md">
    <div class="text-center">
      <div class="flex items-center justify-center mb-4">
        <svg class="h-10 w-10 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M12 6V4m0 16v-2M8 12a4 4 0 118 0 4 4 0 01-8 0z" />
        </svg>
        <span class="ml-3 font-bold text-2xl text-gray-800 dark:text-gray-200">বাংলা ইআরপি</span>
      </div>
      <h2 class="text-xl font-bold text-gray-700 dark:text-gray-300">আপনার অ্যাকাউন্টে লগইন করুন</h2>
      <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">অনুগ্রহ করে আপনার তথ্য দিন</p>
    </div>
    <form class="space-y-6" (ngSubmit)="onLogin()">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">ইমেইল</label>
        <div class="mt-1">
          <input id="email" name="email" type="email" [(ngModel)]="email" required
                 class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500 bg-gray-50 dark:bg-gray-700">
        </div>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">পাসওয়ার্ড</label>
        <div class="mt-1">
          <input id="password" name="password" type="password" [(ngModel)]="password" required
                 class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500 bg-gray-50 dark:bg-gray-700">
        </div>
      </div>
      
      @if (errorMessage()) {
        <div class="p-3 bg-red-50 dark:bg-red-900/50 border border-red-200 dark:border-red-800 rounded-md text-sm text-red-700 dark:text-red-300">
          {{ errorMessage() }}
        </div>
      }

      <div>
        <button type="submit" [disabled]="isLoading()"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:bg-green-400 dark:focus:ring-offset-gray-800">
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span>প্রসেসিং...</span>
          } @else {
            <span>লগইন করুন</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
